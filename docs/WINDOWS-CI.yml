# Inactive template. Owner-reviewed activation at .github/workflows/windows.yml
# is a separate setup step. The first Windows build uses physical PC acceptance.
name: Windows native verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.404'
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-transform-types --test tests/windows-paths.test.ts tests/codex-binary.test.ts tests/windows-files.test.ts tests/updater.test.ts
      - run: npm run native:windows
      - run: python scripts/windows/setup-model.py
      - run: dotnet publish tests/windows/NativeControlFixture.csproj -c Release -o .jarvis/windows-fixture
      - run: npm run test:windows-native
      - run: npm run package:windows
      - run: node scripts/export-source.mjs --check
# No repository-write token, secrets, signing cache, publication or release job.
# Native runtime success does not replace physical microphone/voice acceptance.
