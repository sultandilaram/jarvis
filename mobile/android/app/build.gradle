plugins { id 'com.android.application' }
android {
 namespace 'com.sultan.jarvis.mobile'
 compileSdk 35
 buildFeatures { buildConfig true }
 defaultConfig { applicationId 'com.sultan.jarvis.mobile'; minSdk 26; targetSdk 35; versionCode 20; versionName '0.8.1-test' }
 signingConfigs { testRelease { storeFile file(System.getenv('JARVIS_SIGNING_STORE')); storePassword System.getenv('JARVIS_STORE_PASSWORD'); keyAlias 'jarvis-test'; keyPassword System.getenv('JARVIS_STORE_PASSWORD') } }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.testRelease } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'androidx.core:core:1.15.0'
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
 implementation platform('com.google.firebase:firebase-bom:33.7.0')
 implementation 'com.google.firebase:firebase-messaging'
}
